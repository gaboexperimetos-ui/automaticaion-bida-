[package]
name = "study-platform"
version = "0.1.0"
edition = "2021"
description = "Personal academic productivity web platform"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json", "matched-path"] }
tokio = { version = "1", features = ["full"] }

# HTTP / body types
http = "1"
http-body = "1"
http-body-util = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database — SQLite with lib-sqlite3-sys (bundled, compiled from source)
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono"] }

# Middleware
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Security
argon2 = "0.5"
password-hash = "0.5"
sha2 = "0.10"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"

# New dependencies for Mission 7 (pre-added for parallel development)
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "rustls"] }
pulldown-cmark = "0.13"
toml = "0.8"
csv = "1"
async-trait = "0.1"
mime = "0.3"

[profile.release]
# Optimize for small binary (important for resource-constrained remote)
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# Musl target: override for portable builds
# cargo build --release --target x86_64-unknown-linux-musl RUSTFLAGS='-C link-arg=-s'

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
