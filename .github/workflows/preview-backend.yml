name: Backend real para preview

on:
  push:
    branches:
      - "arena/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "migrations/**"
      - "src/**"
      - "static/**"
      - ".github/workflows/preview-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar binario Linux para Arena
    # Debian 12 (Arena) tiene glibc 2.36; Ubuntu 22.04 genera un binario
    # compatible sin convertir el artefacto en parte del repositorio.
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Guardar caché de compilación
        uses: Swatinem/rust-cache@v2

      - name: Compilar backend real
        run: cargo build --release --locked

      - name: Publicar activo de prerelease borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="preview-backend-${GITHUB_SHA}"
          gh release create "$tag" target/release/study-platform \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease \
            --title "Backend de preview ${GITHUB_SHA::8}" \
            --notes "Binario temporal para ejecutar la app real en Arena. No es un release de producción."
