name: Binario Zig para preview

on:
  push:
    branches:
      - "arena/**"
    paths:
      - "build.zig"
      - "main.zig"
      - "test_root.zig"
      - "migrations/**"
      - "src/**"
      - "static/**"
      - "tests/**"
      - ".github/workflows/preview-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar binario Zig Linux para Arena
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Zig 0.14.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Instalar SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev

      - name: Validar formato, build y tests
        run: |
          zig fmt --check build.zig main.zig test_root.zig src/*.zig
          zig build test --summary all
          zig build -Doptimize=ReleaseFast
          python3 tests/http_smoke.py --binary zig-out/bin/study-platform

      - name: Publicar objeto temporal de prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json

          with open('zig-out/bin/study-platform', 'rb') as source:
              payload = {
                  'encoding': 'base64',
                  'content': base64.b64encode(source.read()).decode('ascii'),
              }
          with open('/tmp/nova-preview-blob.json', 'w') as target:
              json.dump(payload, target)
          PY
          blob_sha=$(gh api --method POST "repos/${{ github.repository }}/git/blobs" \
            --input /tmp/nova-preview-blob.json --jq '.sha')
          test -n "$blob_sha"
          tag="preview-backend-${GITHUB_SHA}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease \
            --title "Binario Zig de preview ${GITHUB_SHA::8}" \
            --notes "Zig 0.14.1 · build ReleaseFast · runtime: SQLite 3 compartido del sistema. Artefacto temporal para Arena, no es un despliegue de producción. Blob SHA: ${blob_sha}"
