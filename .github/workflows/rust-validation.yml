name: Validación del proyecto Rust

on:
  push:
    branches:
      - main
      - "quality/**"
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validacion-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Formato, compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Un merge con conflictos sin resolver no debe llegar silencio a las
      # plantillas: este chequeo temprano lo convierte en fallo inmediato.
      # Solo se buscan los dos marcadores inequívocos, para no fallar por
      # líneas "=======" legítimamente usuales en la documentación.
      - name: Detectar marcadores de conflicto sin resolver
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- . ; then
            echo "::error::El árbol contiene marcadores de conflicto de merge sin resolver."
            exit 1
          fi

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Guardar caché de compilación
        uses: Swatinem/rust-cache@v2

      - name: Comprobar formato
        run: cargo fmt --all -- --check

      - name: Compilar todas las plataformas
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee /tmp/nova-cargo-check.log

      - name: Ejecutar pruebas
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee /tmp/nova-cargo-test.log

      - name: Revisar lint de Rust
        run: |
          set -o pipefail
          cargo clippy --all-targets 2>&1 | tee /tmp/nova-cargo-clippy.log

      - name: Reportar errores en el PR de validación
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Diagnóstico de la validación Rust"
            echo
            for file in /tmp/nova-cargo-*.log; do
              [ -f "$file" ] || continue
              clean="${file%.log}-clean.log"
              sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$file" > "$clean"
              grep -Eq 'error(\[|:)|FAILED|panicked at|assertion.*failed' "$clean" || continue
              echo "#### $(basename "$file")"
              echo '```text'
              grep -n -B 8 -A 18 -E 'error(\[|:)|FAILED|panicked at|assertion.*failed' "$clean" | tail -n 520
              echo '```'
            done
          } > /tmp/nova-validation-comment.md
          pr_number=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" --body-file /tmp/nova-validation-comment.md
          fi
