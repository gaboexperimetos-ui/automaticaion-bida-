<header class="app-topbar nova-topbar fixed top-0 left-0 right-0 h-16 bg-surface-container-low/90 backdrop-blur-xl border-b border-outline-variant/30 z-40 flex items-center justify-between px-4 gap-3">
  <div class="app-topbar-left flex items-center gap-3 min-w-0">
    <a href="/dashboard" class="topbar-brand" aria-label="Study Platform, ir al panel principal">
      <span class="topbar-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 10.5 18 5l10 5.5L18 16 8 10.5Z" fill="currentColor" opacity=".96"/>
          <path d="M10.5 14.5v8.2c0 3.1 3.4 5.8 7.5 5.8s7.5-2.7 7.5-5.8v-8.2L18 18.8l-7.5-4.3Z" fill="currentColor" opacity=".48"/>
          <path d="M28 12v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="topbar-brand-copy">
        <strong>study / platform</strong>
        <small>Tu espacio académico <span>v3.0</span></small>
      </span>
    </a>
    <form class="topbar-search relative" action="/dashboard/search" method="get" role="search">
      <span class="topbar-search-icon material-symbols-outlined" aria-hidden="true">search</span>
      <input name="q" class="topbar-search-input" placeholder="¿Qué necesitas encontrar?" type="text" autocomplete="off"/>
      <kbd class="topbar-search-shortcut" aria-hidden="true">⌘ K</kbd>
    </form>
  </div>

  <div class="app-topbar-actions flex items-center gap-2 shrink-0">
    <div class="relative">
      <button type="button" class="topbar-create flex items-center gap-1.5 bg-secondary text-on-secondary" aria-label="Crear un elemento">
        <span class="material-symbols-outlined">add</span>
        <span class="topbar-create-label">Crear</span>
        <span class="topbar-create-chevron material-symbols-outlined">expand_more</span>
      </button>
    </div>

    <a href="/dashboard/mcp" class="topbar-status" title="Ver estado de conexiones">
      <!--SLOT:SHELL_STATUS-->
    </a>

    <div class="relative">
      <button type="button" class="topbar-notification relative" title="Notificaciones">
        <span class="material-symbols-outlined">notifications</span>
        <span class="topbar-notification-dot" aria-hidden="true"></span>
      </button>
    </div>

    <div class="topbar-user flex items-center gap-space-xs pl-space-xs border-l border-outline-variant/40">
      <span class="relative shrink-0"><!--SLOT:SHELL_AVATAR--><span class="topbar-user-presence" aria-hidden="true"></span></span>
      <span class="topbar-user-copy flex flex-col text-left">
        <span class="topbar-user-name font-label-sm text-label-sm text-on-surface font-semibold leading-tight"><!--SLOT:SHELL_NAME--></span>
        <span class="topbar-user-role font-body-sm text-[10px] text-outline leading-tight"><!--SLOT:SHELL_ROLE--></span>
      </span>
      <span class="topbar-user-chevron material-symbols-outlined text-[16px] text-outline cursor-pointer">expand_more</span>
    </div>
  </div>
</header>
