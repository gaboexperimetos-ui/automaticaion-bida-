<header class="app-topbar nx-topbar">
  <div class="app-topbar-left nx-topbar-leading">
    <a href="/dashboard" class="topbar-brand nx-mobile-brand" aria-label="NOVA, ir al inicio"><span>N</span><strong>NOVA</strong><small>3.0</small></a>
    <div class="nx-topbar-context"><span>NOVA</span><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span><strong>Tu espacio académico</strong></div>
  </div>

  <form class="topbar-search nx-global-search" action="/dashboard/search" method="get" role="search">
    <span class="topbar-search-icon material-symbols-outlined" aria-hidden="true">search</span>
    <input name="q" class="topbar-search-input" placeholder="Buscar notas, tareas o archivos…" type="search" autocomplete="off" aria-label="Búsqueda global">
    <kbd class="topbar-search-shortcut" aria-hidden="true">⌘ K</kbd>
  </form>

  <div class="app-topbar-actions nx-topbar-actions">
    <a href="/dashboard/mcp" class="topbar-status nx-connection" title="Ver estado de conexiones"><!--SLOT:SHELL_STATUS--></a>
    <div class="relative nx-create-wrap">
      <button type="button" class="topbar-create nx-create-button" aria-label="Crear un elemento"><span class="material-symbols-outlined">add</span><span class="topbar-create-label">Crear</span><span class="topbar-create-chevron material-symbols-outlined">expand_more</span></button>
    </div>
    <button type="button" class="topbar-notification nx-icon-button nx-notification" title="Notificaciones" aria-label="Notificaciones"><span class="material-symbols-outlined">notifications</span><i aria-hidden="true"></i></button>
    <div class="topbar-user border-l border-outline-variant/40 nx-user-placeholder">
      <span class="relative shrink-0"><!--SLOT:SHELL_AVATAR--><span class="topbar-user-presence" aria-hidden="true"></span></span>
      <span class="topbar-user-copy"><span class="topbar-user-name"><!--SLOT:SHELL_NAME--></span><span class="topbar-user-role"><!--SLOT:SHELL_ROLE--></span></span>
      <span class="topbar-user-chevron material-symbols-outlined">expand_more</span>
    </div>
  </div>
</header>
