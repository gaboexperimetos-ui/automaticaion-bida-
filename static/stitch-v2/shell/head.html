<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="shell-type" content="web_dashboard">
<meta name="theme-color" content="#14101c">
<meta name="color-scheme" content="dark">
<title>NOVA Nébula · Tu espacio académico</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @layer base {
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
    main > :first-child { margin-top: 0 !important; }
    main > :last-child { margin-bottom: 0 !important; }
  }
</style>
<script>
  (function () {
    var map = { "osaka-jade":"#0e1813","tokyo-night":"#1a1b26","catppuccin":"#1e1e2e","gruvbox":"#282828","nord":"#2e3440","dracula":"#282a36","rose-pine":"#191724","everforest":"#2d353b","solarized":"#002b36","kanagawa":"#1f1f28","nebula":"#14101c" };
    var t = "";
    try { t = localStorage.getItem("nova.theme") || ""; } catch (e) {}
    if (!map[t]) {
      var c = document.cookie.match(/(?:^|;\s*)nova_theme=([^;]+)/);
      if (c) { try { t = decodeURIComponent(c[1]); } catch (e) {} }
    }
    if (!map[t]) t = "nebula";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("nova.theme", t); } catch (e) {}
    document.cookie = "nova_theme=" + encodeURIComponent(t) + "; path=/; max-age=31536000; samesite=lax";
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", map[t]);
    // Red de seguridad: si un swap de HTMX o una navegación deja el <html>
    // sin el tema guardado, se reaplica antes de repintar.
    function reapplyTheme() {
      var saved = "";
      try { saved = localStorage.getItem("nova.theme"); } catch (e) {}
      if (!saved) {
        var cookie = document.cookie.match(/(?:^|;\s*)nova_theme=([^;]+)/);
        if (cookie) { try { saved = decodeURIComponent(cookie[1]); } catch (e) {} }
      }
      if (!saved || !map[saved]) return;
      if (document.documentElement.getAttribute("data-theme") !== saved) {
        document.documentElement.setAttribute("data-theme", saved);
      }
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", map[saved]);
    }
    document.addEventListener("htmx:afterSwap", reapplyTheme);
    document.addEventListener("htmx:afterSettle", reapplyTheme);
    window.addEventListener("pageshow", reapplyTheme);
  })();
</script>
