<div class="nova-page nova-chat-page">
  <div class="nova-chat-layout">
    <button class="nova-chat-scrim" type="button" aria-label="Cerrar paneles laterales"></button>
    <aside class="nova-chat-history" id="chat-history" aria-label="Historial de conversaciones">
      <div class="nova-chat-sidebar-head"><div><span>TU ESPACIO</span><h2>Conversaciones</h2></div><button class="nova-icon-button" id="close-history-btn" type="button" aria-label="Cerrar historial"><span class="material-symbols-outlined">close</span></button></div>
      <label class="nova-compact-search" for="session-search"><span class="material-symbols-outlined">search</span><input id="session-search" placeholder="Buscar conversación…" type="search"></label>
      <div class="nova-chat-filters" aria-label="Filtrar por materia"><button type="button">Todas</button><!--SLOT:CHAT_FILTERS--></div>
      <div class="nova-chat-sessions"><!--SLOT:CHAT_SESSIONS--></div>
      <div class="nova-chat-quota">
        <div><span><!--SLOT:CHAT_MODE_DOT--> <!--SLOT:CHAT_MODEL--></span><strong><!--SLOT:CHAT_QUOTA_PCT--></strong></div>
        <div class="nova-quota-track"><!--SLOT:CHAT_QUOTA_BAR--></div>
        <footer><span><!--SLOT:CHAT_COSTS--></span><!--SLOT:CHAT_MODE--></footer>
      </div>
    </aside>

    <section class="nova-conversation" aria-label="Conversación actual">
      <header class="nova-conversation-head">
        <div class="nova-conversation-context">
          <button class="nova-icon-button nova-chat-history-toggle" id="toggle-history-btn" type="button" aria-label="Abrir historial" aria-controls="chat-history" aria-expanded="false"><span class="material-symbols-outlined">menu</span></button>
          <span class="nova-conversation-mark"><span class="material-symbols-outlined">auto_awesome</span></span>
          <div><span>ASISTENTE ACADÉMICO</span><div data-context><!--SLOT:CHAT_CONTEXT--></div></div>
        </div>
        <div class="nova-conversation-actions">
          <button class="nova-button nova-button-quiet" id="toggle-sources-btn" type="button" title="Alternar panel de fuentes"><span class="material-symbols-outlined">menu_book</span><span class="nova-action-label">Fuentes <b><!--SLOT:CHAT_FCOUNT--></b></span></button>
          <button class="nova-button nova-button-primary" id="btn-new-chat" type="button" title="Nueva conversación"><span class="material-symbols-outlined">add</span><span class="nova-action-label">Nueva</span></button>
          <button id="btn-clear-chat" class="nova-icon-button" type="button" title="Limpiar pantalla" aria-label="Limpiar conversación"><span class="material-symbols-outlined">restart_alt</span></button>
        </div>
      </header>
      <div class="nova-chat-messages" id="chat-messages-container"><!--SLOT:CHAT_MESSAGES--></div>
      <footer class="nova-composer">
        <div class="nova-composer-box">
          <label for="prompt-input" class="sr-only">Mensaje para el asistente</label>
          <textarea id="prompt-input" placeholder="Escribe tu pregunta…" rows="2"></textarea>
          <div class="nova-composer-toolbar">
            <div><button type="button" title="Adjuntar archivo o nota" aria-label="Adjuntar archivo o nota"><span class="material-symbols-outlined">attach_file</span></button><button type="button" title="Vincular apunte del Segundo Cerebro" aria-label="Vincular apunte"><span class="material-symbols-outlined">add_link</span></button><button type="button" title="Dictado por voz" aria-label="Dictado por voz"><span class="material-symbols-outlined">mic</span></button><span>Modo: <!--SLOT:CHAT_COMPOSER_MODE--></span></div>
            <button class="nova-button nova-button-primary" id="send-btn" type="button"><span>Enviar</span><span class="material-symbols-outlined">arrow_upward</span></button>
          </div>
        </div>
        <div class="nova-prompt-actions" aria-label="Acciones de estudio">
          <button id="btn-summarize" type="button"><span class="material-symbols-outlined">summarize</span>Resumir</button>
          <button id="btn-explain" type="button"><span class="material-symbols-outlined">search_insights</span>Explicar</button>
          <button id="btn-quiz" type="button"><span class="material-symbols-outlined">quiz</span>Cuestionario</button>
          <button id="btn-flashcards" type="button"><span class="material-symbols-outlined">style</span>Flashcards</button>
          <button id="btn-plan" type="button"><span class="material-symbols-outlined">calendar_month</span>Plan de estudio</button>
        </div>
        <p><span>La IA puede equivocarse. Contrasta lo importante.</span><span><kbd>Enter</kbd> enviar · <kbd>Shift</kbd> + <kbd>Enter</kbd> nueva línea</span></p>
      </footer>
    </section>

    <aside class="nova-chat-sources hidden" id="sources-sidebar" aria-label="Fuentes y contexto">
      <div class="nova-panel-caption"><span>03</span><h2>Fuentes y contexto</h2><button class="nova-icon-button" id="close-sources-btn" type="button" title="Ocultar panel" aria-label="Cerrar fuentes"><span class="material-symbols-outlined">close</span></button></div>
      <p class="nova-card-intro">Material relacionado con esta conversación.</p>
      <div class="nova-sources-list"><!--SLOT:CHAT_SOURCES--></div>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";
  const sendBtn = document.getElementById("send-btn");
  const promptInput = document.getElementById("prompt-input");
  const chatContainer = document.getElementById("chat-messages-container");
  const newChatBtn = document.getElementById("btn-new-chat");
  const clearChatBtn = document.getElementById("btn-clear-chat");
  const summarizeBtn = document.getElementById("btn-summarize");
  const explainBtn = document.getElementById("btn-explain");
  const quizBtn = document.getElementById("btn-quiz");
  const flashcardsBtn = document.getElementById("btn-flashcards");
  const toggleSourcesBtn = document.getElementById("toggle-sources-btn");
  const closeSourcesBtn = document.getElementById("close-sources-btn");
  const sourcesSidebar = document.getElementById("sources-sidebar");

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function renderMessage(role, content) {
    const div = document.createElement("div");
    const isUser = role === "user";
    div.className = isUser ? "nova-message nova-message-user flex-row-reverse" : "nova-message nova-message-assistant";
    div.setAttribute("data-chat-turn", isUser ? "user" : "assistant");
    if (isUser) {
      div.innerHTML = '<div class="nova-message-avatar nova-message-avatar-user">TÚ</div><div class="nova-message-content"><div class="nova-message-meta"><span class="nova-message-author">Tú</span><span class="nova-message-time">Ahora</span></div><div class="nova-message-bubble"><p class="nova-message-text">' + esc(content) + '</p></div></div>';
    } else {
      div.innerHTML = '<div class="nova-message-avatar nova-message-avatar-assistant"><span class="material-symbols-outlined">auto_awesome</span></div><div class="nova-message-content"><div class="nova-message-meta"><span class="nova-message-author">Asistente</span><span class="nova-message-time">Ahora</span></div><div class="nova-message-bubble"><p class="nova-message-text">' + esc(content) + '</p></div></div>';
    }
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function lastAIMessage() {
    const msgs = chatContainer.querySelectorAll('[data-chat-turn="assistant"] .nova-message-text');
    return msgs.length ? msgs[msgs.length - 1].textContent : "";
  }

  function showError(msg) {
    const d = document.createElement("div");
    d.className = "nova-chat-state is-error";
    d.innerHTML = '<span class="material-symbols-outlined">error</span><div><strong>No se pudo completar</strong><p>' + esc(msg) + '</p></div>';
    chatContainer.appendChild(d);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function setLoading(flag) {
    if (!sendBtn) return;
    sendBtn.disabled = flag;
    sendBtn.innerHTML = flag ? '<span class="material-symbols-outlined text-[18px] animate-spin">autorenew</span><span class="ml-2">Enviando...</span>' : '<span>Enviar</span><span class="material-symbols-outlined text-[18px]">arrow_upward</span>';
  }

  async function sendMessage() {
    const message = promptInput.value.trim();
    if (!message) return;
    renderMessage("user", message);
    promptInput.value = "";
    setLoading(true);
    try {
      const resp = await fetch("/api/ai/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: message, subject: "general" }) });
      const text = await resp.text();
      setLoading(false);
      if (resp.ok) renderMessage("assistant", text);
      else showError("Error: " + text);
    } catch (e) {
      setLoading(false);
      showError("Error de conexion: " + esc(e.message));
    }
  }

  async function callJSON(url, body, render) {
    setLoading(true);
    try {
      const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await resp.json();
      setLoading(false);
      if (resp.ok) render(data);
      else showError("Error: " + (data.error || "fallo"));
    } catch (e) {
      setLoading(false);
      showError("Error de conexion: " + esc(e.message));
    }
  }

  function summarize()   { const c = lastAIMessage(); if (!c) { showError("Genera un mensaje primero."); return; } callJSON("/api/ai/summary", { content: c }, d => renderMessage("assistant", "## Resumen\n\n" + (d.summary || JSON.stringify(d)))); }
  function explain()     { const c = promptInput.value.trim(); if (!c) { showError("Escribe algo."); return; } renderMessage("user", "Explicar a fondo: " + c); promptInput.value = ""; setLoading(true); fetch("/api/ai/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "Explica esto a fondo y con detalle: " + c, subject: "general" }) }).then(r => r.text()).then(t => { renderMessage("assistant", t); setLoading(false); }).catch(e => { setLoading(false); showError("Error: " + esc(e.message)); }); }
  function quiz()        { const c = lastAIMessage(); if (!c) { showError("Genera un mensaje primero."); return; } callJSON("/api/ai/quiz", { content: c, num_questions: 5 }, d => { let o = "## Cuestionario\n\n"; (d.questions || []).forEach((q,i) => { o += (i+1) + ". " + (q.question||q.text||"") + "\n"; if (q.options) q.options.forEach(op => o += " - " + op + "\n"); o += " Respuesta: " + (q.answer||q.correct_answer||"") + "\n\n"; }); renderMessage("assistant", o); }); }
  function flashcards()  { const c = lastAIMessage(); if (!c) { showError("Genera un mensaje primero."); return; } callJSON("/api/ai/study-sheet", { content: c }, d => renderMessage("assistant", d.study_sheet || JSON.stringify(d))); }
  function clearChat()   { chatContainer.innerHTML = '<div class="nova-chat-welcome" data-chat-empty="1"><div class="nova-chat-welcome-badge"><span class="material-symbols-outlined">auto_awesome</span>Sin conversaciones</div><h2>¿Qué quieres aprender hoy?</h2><p>Envía un mensaje para empezar o elige una forma de trabajar.</p><div class="nova-chat-starters"><button type="button" data-chat-prompt="Explícame este tema paso a paso y con un ejemplo: "><span class="material-symbols-outlined">lightbulb</span><span><strong>Entender un tema</strong><small>Explicación clara y con ejemplos</small></span><span class="material-symbols-outlined">north_east</span></button><button type="button" data-chat-prompt="Resume estos apuntes en ideas clave: "><span class="material-symbols-outlined">summarize</span><span><strong>Resumir apuntes</strong><small>Lo esencial, sin rodeos</small></span><span class="material-symbols-outlined">north_east</span></button><button type="button" data-chat-prompt="Crea un cuestionario de 5 preguntas sobre: "><span class="material-symbols-outlined">quiz</span><span><strong>Practicar</strong><small>Un cuestionario para repasar</small></span><span class="material-symbols-outlined">north_east</span></button></div></div>'; }

  if (toggleSourcesBtn && sourcesSidebar) toggleSourcesBtn.addEventListener("click", () => sourcesSidebar.classList.toggle("hidden"));
  if (closeSourcesBtn && sourcesSidebar) closeSourcesBtn.addEventListener("click", () => sourcesSidebar.classList.add("hidden"));
  if (sendBtn && promptInput && chatContainer) {
    sendBtn.addEventListener("click", sendMessage);
    promptInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  }
  if (newChatBtn) newChatBtn.addEventListener("click", clearChat);
  if (clearChatBtn) clearChatBtn.addEventListener("click", clearChat);
  if (summarizeBtn) summarizeBtn.addEventListener("click", summarize);
  if (explainBtn) explainBtn.addEventListener("click", explain);
  if (quizBtn) quizBtn.addEventListener("click", quiz);
  if (flashcardsBtn) flashcardsBtn.addEventListener("click", flashcards);
  if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
})();
</script>
