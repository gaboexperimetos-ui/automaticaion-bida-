</button>

</button>

<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary-container">source</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Fuentes y contexto</span>
</div>
<button class="p-1 rounded text-outline hover:text-on-surface hover:bg-surface-container transition-colors" id="close-sources-btn" title="Ocultar panel">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>

<!--SLOT:CHAT_SOURCES-->
</div>

</div>
</div>
<script>
(function () {
  "use strict";
  const sendBtn = document.getElementById("send-btn");
  const promptInput = document.getElementById("prompt-input");
  const chatContainer = document.getElementById("chat-messages-container");
  const newChatBtn = document.getElementById("btn-new-chat");
  const clearChatBtn = document.getElementById("btn-clear-chat");
  const summarizeBtn = document.getElementById("btn-summarize");
  const explainBtn = document.getElementById("btn-explain");
  const quizBtn = document.getElementById("btn-quiz");
  const flashcardsBtn = document.getElementById("btn-flashcards");
  const toggleSourcesBtn = document.getElementById("toggle-sources-btn");
  const closeSourcesBtn = document.getElementById("close-sources-btn");
  const sourcesSidebar = document.getElementById("sources-sidebar");

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function renderMessage(role, content) {
    const div = document.createElement("div");
    div.className = "flex items-start gap-3 max-w-4xl mx-auto w-full";
    if (role === "user") {
      div.innerHTML = '<div class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 font-label-md text-on-surface font-bold">TU</div><div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-1"><span class="font-label-md text-label-md font-semibold text-on-surface">Estudiante</span><span class="font-code-inline text-[10px] text-outline">Ahora</span></div><div class="bg-surface-container-high text-on-surface rounded-xl p-3 shadow-sm"><p class="font-body-md text-body-md leading-relaxed whitespace-pre-wrap">' + esc(content) + '</p></div></div>';
    } else {
      div.innerHTML = '<div class="w-9 h-9 rounded-full bg-primary-container/15 flex items-center justify-center shrink-0 text-primary-container"><span class="material-symbols-outlined text-[20px]">smart_toy</span></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-1"><span class="font-label-md text-label-md font-semibold text-primary-fixed-dim">Asistente IA</span></div><div class="bg-surface-container-low rounded-xl p-3 text-on-surface shadow-md"><p class="font-body-md text-body-md leading-relaxed text-on-surface-variant whitespace-pre-wrap">' + esc(content) + '</p></div></div>';
    }
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function lastAIMessage() {
    const msgs = chatContainer.querySelectorAll(".flex-1.min-w-0");
    if (msgs.length === 0) return "";
    const p = msgs[msgs.length - 1].querySelector("p");
    return p ? p.textContent : "";
  }

  function showError(msg) {
    const d = document.createElement("div");
    d.className = "flex items-center gap-2 max-w-4xl mx-auto";
    d.innerHTML = '<span class="material-symbols-outlined text-[20px] text-error">error</span><span class="font-body-sm text-on-error-container">' + esc(msg) + '</span>';
    chatContainer.appendChild(d);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function setLoading(flag) {
    if (!sendBtn) return;
    sendBtn.disabled = flag;
    sendBtn.innerHTML = flag ? '<span class="material-symbols-outlined text-[18px] animate-spin">autorenew</span><span class="ml-2">Enviando...</span>' : '<span>Enviar mensaje</span><span class="material-symbols-outlined text-[18px]">send</span>';
  }

  async function sendMessage() {
    const message = promptInput.value.trim();
    if (!message) return;
    renderMessage("user", message);
    promptInput.value = "";
    setLoading(true);
    try {
      const resp = await fetch("/api/ai/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: message, subject: "general" }) });
      const text = await resp.text();
      setLoading(false);
      if (resp.ok) renderMessage("assistant", text);
      else showError("Error: " + text);
    } catch (e) {
      setLoading(false);
      showError("Error de conexion: " + esc(e.message));
    }
  }

  async function callJSON(url, body, render) {
    setLoading(true);
    try {
      const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await resp.json();
      setLoading(false);
      if (resp.ok) render(data);
      else showError("Error: " + (data.error || "fallo"));
    } catch (e) {
      setLoading(false);
      showError("Error de conexion: " + esc(e.message));
    }
  }

  function summarize()   { const c = lastAIMessage(); if (!c) { showError("Genera un mensaje primero."); return; } callJSON("/api/ai/summary", { content: c }, d => renderMessage("assistant", "## Resumen\n\n" + (d.summary || JSON.stringify(d)))); }
  function explain()     { const c = promptInput.value.trim(); if (!c) { showError("Escribe algo."); return; } renderMessage("user", "Explicar a fondo: " + c); promptInput.value = ""; setLoading(true); fetch("/api/ai/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "Explica esto a fondo y con detalle: " + c, subject: "general" }) }).then(r => r.text()).then(t => { renderMessage("assistant", t); setLoading(false); }).catch(e => { setLoading(false); showError("Error: " + esc(e.message)); }); }
  function quiz()        { const c = lastAIMessage(); if (!c) { showError("Genera un mensaje primero."); return; } callJSON("/api/ai/quiz", { content: c, num_questions: 5 }, d => { let o = "## Cuestionario\n\n"; (d.questions || []).forEach((q,i) => { o += (i+1) + ". " + (q.question||q.text||"") + "\n"; if (q.options) q.options.forEach(op => o += " - " + op + "\n"); o += " Respuesta: " + (q.answer||q.correct_answer||"") + "\n\n"; }); renderMessage("assistant", o); }); }
  function flashcards()  { const c = lastAIMessage(); if (!c) { showError("Genera un mensaje primero."); return; } callJSON("/api/ai/study-sheet", { content: c }, d => renderMessage("assistant", d.study_sheet || JSON.stringify(d))); }
  function clearChat()   { chatContainer.innerHTML = '<div class="text-center py-8"><p class="font-body-sm text-body-sm text-on-surface-variant">¡Hola! Soy tu asistente académico. Escribe un mensaje para comenzar.</p></div>'; }

  if (toggleSourcesBtn && sourcesSidebar) toggleSourcesBtn.addEventListener("click", () => sourcesSidebar.classList.toggle("hidden"));
  if (closeSourcesBtn && sourcesSidebar) closeSourcesBtn.addEventListener("click", () => sourcesSidebar.classList.add("hidden"));
  if (sendBtn && promptInput && chatContainer) {
    sendBtn.addEventListener("click", sendMessage);
    promptInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  }
  if (newChatBtn) newChatBtn.addEventListener("click", clearChat);
  if (clearChatBtn) clearChatBtn.addEventListener("click", clearChat);
  if (summarizeBtn) summarizeBtn.addEventListener("click", summarize);
  if (explainBtn) explainBtn.addEventListener("click", explain);
  if (quizBtn) quizBtn.addEventListener("click", quiz);
  if (flashcardsBtn) flashcardsBtn.addEventListener("click", flashcards);
})();
</script>
