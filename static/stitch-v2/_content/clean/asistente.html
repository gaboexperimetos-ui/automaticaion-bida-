<div class="nx-chat nova-chat-layout">
  <button class="nx-chat-scrim nova-chat-scrim" type="button" aria-label="Cerrar paneles laterales"></button>

  <aside class="nx-chat-history nova-chat-history" id="chat-history" aria-label="Historial de conversaciones">
    <header class="nx-chat-history-head">
      <div><p class="nx-eyebrow">NOVA AI</p><h1>Conversaciones</h1></div>
      <button class="nx-icon-button nx-chat-mobile-close" id="close-history-btn" type="button" aria-label="Cerrar historial"><span class="material-symbols-outlined">close</span></button>
    </header>
    <button class="nx-button nx-button-primary nx-new-chat" id="btn-new-chat" type="button"><span class="material-symbols-outlined">add</span>Nueva conversación</button>
    <label class="nx-chat-search" for="session-search"><span class="material-symbols-outlined">search</span><input id="session-search" placeholder="Buscar conversación…" type="search"></label>
    <div class="nx-chat-filters" aria-label="Filtrar por materia"><button type="button">Todas</button><!--SLOT:CHAT_FILTERS--></div>
    <div class="nx-chat-sessions nova-chat-sessions"><!--SLOT:CHAT_SESSIONS--></div>
    <footer class="nx-chat-quota">
      <div><span><!--SLOT:CHAT_MODE_DOT--> <!--SLOT:CHAT_MODEL--></span><strong><!--SLOT:CHAT_QUOTA_PCT--></strong></div>
      <div class="nx-quota-track"><!--SLOT:CHAT_QUOTA_BAR--></div>
      <p><span><!--SLOT:CHAT_COSTS--></span><!--SLOT:CHAT_MODE--></p>
    </footer>
  </aside>

  <section class="nx-conversation" aria-label="Conversación actual">
    <header class="nx-conversation-head">
      <div class="nx-conversation-title">
        <button class="nx-icon-button nx-chat-history-toggle" id="toggle-history-btn" type="button" aria-label="Abrir historial" aria-controls="chat-history" aria-expanded="false"><span class="material-symbols-outlined">menu</span></button>
        <span class="nx-conversation-mark material-symbols-outlined">auto_awesome</span>
        <div><span>Asistente académico</span><div class="nx-chat-context" data-context><!--SLOT:CHAT_CONTEXT--></div></div>
      </div>
      <div class="nx-conversation-actions">
        <button class="nx-button nx-button-secondary" id="toggle-sources-btn" type="button" aria-controls="sources-sidebar" aria-expanded="false"><span class="material-symbols-outlined">menu_book</span><span>Fuentes <b><!--SLOT:CHAT_FCOUNT--></b></span></button>
        <button id="btn-clear-chat" class="nx-icon-button" type="button" title="Limpiar pantalla" aria-label="Limpiar conversación"><span class="material-symbols-outlined">restart_alt</span></button>
      </div>
    </header>

    <div class="nx-chat-messages" id="chat-messages-container"><!--SLOT:CHAT_MESSAGES--></div>

    <footer class="nx-composer">
      <div class="nx-composer-tools" aria-label="Acciones de estudio">
        <button id="btn-summarize" class="nx-chat-tool" type="button"><span class="material-symbols-outlined">summarize</span>Resumir</button>
        <button id="btn-explain" class="nx-chat-tool" type="button"><span class="material-symbols-outlined">search_insights</span>Explicar</button>
        <button id="btn-quiz" class="nx-chat-tool" type="button"><span class="material-symbols-outlined">quiz</span>Cuestionario</button>
        <button id="btn-flashcards" class="nx-chat-tool" type="button"><span class="material-symbols-outlined">style</span>Flashcards</button>
        <button id="btn-plan" class="nx-chat-tool" type="button"><span class="material-symbols-outlined">calendar_month</span>Plan de estudio</button>
      </div>
      <div class="nx-composer-box">
        <label for="prompt-input" class="sr-only">Mensaje para el asistente</label>
        <textarea id="prompt-input" placeholder="Pregunta sobre tus materias o pega una idea para trabajarla…" rows="2"></textarea>
        <div class="nx-composer-bottom">
          <div class="nx-composer-attachments nx-rag-picker">
            <span class="material-symbols-outlined" aria-hidden="true">database</span>
            <label class="sr-only" for="rag-mode">Información que puede usar el asistente</label>
            <select id="rag-mode" name="mode" aria-describedby="rag-mode-help">
              <option value="hybrid" selected>Notas + web</option>
              <option value="notes">Solo mis notas</option>
              <option value="general">Sin notas</option>
            </select>
            <span id="rag-mode-help">Notas primero; web si hace falta</span>
          </div>
          <button class="nx-send-button" id="send-btn" type="button"><span>Enviar</span><span class="material-symbols-outlined">arrow_upward</span></button>
        </div>
      </div>
      <div class="nx-composer-meta"><span>La IA puede equivocarse. Contrasta lo importante.</span><span><kbd>Enter</kbd> enviar · <kbd>Shift</kbd> + <kbd>Enter</kbd> nueva línea</span></div>
    </footer>
  </section>

  <aside class="nx-chat-sources hidden" id="sources-sidebar" aria-label="Fuentes y contexto">
    <header><div><p class="nx-eyebrow">Contexto</p><h2>Fuentes</h2></div><button class="nx-icon-button" id="close-sources-btn" type="button" aria-label="Cerrar fuentes"><span class="material-symbols-outlined">close</span></button></header>
    <p id="sources-summary" aria-live="polite">Las fuentes aparecen después de enviar una pregunta.</p>
    <div class="nx-sources-list" id="sources-list"><!--SLOT:CHAT_SOURCES--></div>
  </aside>
</div>

<script>
(function () {
  "use strict";
  var container = document.getElementById("chat-messages-container");
  var prompt = document.getElementById("prompt-input");
  var send = document.getElementById("send-btn");
  var sources = document.getElementById("sources-sidebar");
  var sourcesToggle = document.getElementById("toggle-sources-btn");
  var sourcesClose = document.getElementById("close-sources-btn");
  if (!container || !prompt || !send) return;

  function esc(value) { return String(value).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function scroll() { container.scrollTop = container.scrollHeight; }
  function setSources(open) {
    if (!sources) return;
    sources.classList.toggle("hidden", !open);
    if (sourcesToggle) sourcesToggle.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function showError(message) {
    var node = document.createElement("div");
    node.className = "nx-chat-error nova-chat-state is-error";
    node.innerHTML = '<span class="material-symbols-outlined">error</span><div><strong>No se pudo completar</strong><p>' + esc(message) + '</p></div>';
    container.appendChild(node); scroll();
  }
  function appendAssistant(content) {
    var row = document.createElement("article");
    row.className = "nx-message nx-message-assistant nova-message nova-message-assistant";
    row.setAttribute("data-chat-turn", "assistant");
    row.innerHTML = '<div class="nx-message-avatar nova-message-avatar nova-message-avatar-assistant"><span class="material-symbols-outlined">auto_awesome</span></div><div class="nx-message-content nova-message-content"><div class="nx-message-meta nova-message-meta"><strong>NOVA AI</strong><span>Ahora</span></div><div class="nx-message-bubble nova-message-bubble"><p class="nx-message-text nova-message-text"></p></div></div>';
    row.querySelector(".nx-message-text").textContent = content;
    container.appendChild(row); scroll();
  }
  function lastAnswer() {
    var messages = container.querySelectorAll('[data-chat-turn="assistant"] .nx-message-text, [data-chat-turn="assistant"] .nova-message-text');
    return messages.length ? messages[messages.length - 1].textContent.trim() : "";
  }
  function attachedContext() {
    try { return JSON.parse(sessionStorage.getItem("sp:ai-ctx") || "null"); }
    catch (error) { return null; }
  }
  function sourceContent() {
    var context = attachedContext();
    var content = prompt.value.trim() || (context && context.c ? String(context.c) : "") || lastAnswer();
    if (!content) showError("Escribe una idea, adjunta una nota o genera una respuesta primero.");
    return content.slice(0, 7600);
  }
  function setToolsBusy(busy) {
    document.querySelectorAll(".nx-chat-tool").forEach(function (button) { button.disabled = busy; });
  }
  async function callJSON(url, body, render) {
    setToolsBusy(true);
    try {
      var response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      var data = await response.json();
      if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
      render(data);
    } catch (error) { showError(error.message || "Error de conexión"); }
    finally { setToolsBusy(false); }
  }
  function ask(text) { prompt.value = text; prompt.focus(); send.click(); }

  document.getElementById("btn-summarize").addEventListener("click", function () {
    var content = sourceContent(); if (!content) return;
    callJSON("/api/ai/summary", { content: content }, function (data) { appendAssistant("Resumen\n\n" + (data.summary || JSON.stringify(data))); });
  });
  document.getElementById("btn-explain").addEventListener("click", function () {
    var content = sourceContent();
    if (!content) return;
    ask("Explica esto a fondo, con un ejemplo y los errores frecuentes:\n\n" + content);
  });
  document.getElementById("btn-quiz").addEventListener("click", function () {
    var content = sourceContent(); if (!content) return;
    callJSON("/api/ai/quiz", { content: content, num_questions: 5 }, function (data) {
      var output = "Cuestionario\n\n";
      (data.questions || []).forEach(function (question, index) {
        output += (index + 1) + ". " + (question.question || question.text || "") + "\n";
        (question.options || []).forEach(function (option) { output += "   • " + option + "\n"; });
        output += "Respuesta: " + (question.answer || question.correct_answer || "") + "\n\n";
      });
      appendAssistant(output);
    });
  });
  document.getElementById("btn-flashcards").addEventListener("click", function () {
    var content = sourceContent(); if (!content) return;
    callJSON("/api/ai/study-sheet", { content: content }, function (data) { appendAssistant(data.study_sheet || JSON.stringify(data)); });
  });
  document.getElementById("btn-plan").addEventListener("click", function () {
    var content = sourceContent();
    if (!content) return;
    ask("Crea un plan de estudio concreto, por sesiones y con repaso activo, para:\n\n" + content);
  });
  if (sourcesToggle) sourcesToggle.addEventListener("click", function () { setSources(sources.classList.contains("hidden")); });
  if (sourcesClose) sourcesClose.addEventListener("click", function () { setSources(false); });
  prompt.addEventListener("input", function () { prompt.style.height = "auto"; prompt.style.height = Math.min(prompt.scrollHeight, 180) + "px"; });
  scroll();
})();
</script>
