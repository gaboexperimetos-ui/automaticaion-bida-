<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-md">
  <!-- MCP Status Banner -->
  <div class="flex items-center gap-1.5 px-space-sm py-1.5 rounded-xl bg-surface-container border border-outline-variant/40 text-[11px]">
    <!--SLOT:MCP_STATUS-->
  </div>

  <!-- Generator Card -->
  <div class="bg-surface-container border border-outline-variant/40 rounded-xl p-space-md">
    <div class="flex items-center justify-between mb-space-sm">
      <h2 class="font-headline-sm text-headline-sm text-primary-container flex items-center gap-space-xs">
        <span class="material-symbols-outlined text-[20px] text-primary-container">draw</span>
        <span>Generador de Material</span>
      </h2>
      <div class="flex items-center gap-space-xs">
        <span class="w-2 h-2 rounded-full <!--SLOT:AI_DOT-->"></span>
        <span class="font-code-inline text-[10px] text-outline"><!--SLOT:AI_MODEL--></span>
      </div>
    </div>

    <!-- Form Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
      <!-- Materia Selector -->
      <div>
        <label for="materia-select" class="font-label-sm text-label-sm text-on-surface-variant mb-1 flex items-center gap-1">
          <span class="material-symbols-outlined text-[18px] text-primary-container" aria-hidden="true">menu_book</span>
          <span>Materia</span>
        </label>
        <select id="materia-select"
                class="w-full px-space-sm py-2 rounded-lg bg-surface-container-high border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary-container appearance-none">
          <!--SLOT:MATERIA_OPTIONS-->
        </select>
      </div>

      <!-- Tipo Selector -->
      <div>
        <label for="tipo-select" class="font-label-sm text-label-sm text-on-surface-variant mb-1 flex items-center gap-1">
          <span class="material-symbols-outlined text-[18px] text-primary-container" aria-hidden="true">quiz</span>
          <span>Tipo de material</span>
        </label>
        <select id="tipo-select"
                class="w-full px-space-sm py-2 rounded-lg bg-surface-container-high border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary-container appearance-none">
          <option value="Quiz">Cuestionario</option>
          <option value="Resumen">Resumen</option>
          <option value="Ficha de estudio">Ficha de estudio</option>
          <option value="Explicación">Explicación</option>
        </select>
      </div>
    </div>

    <!-- Tema Input -->
    <div class="mt-space-md">
      <label for="tema-input" class="font-label-sm text-label-sm text-on-surface-variant mb-1 flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px] text-primary-container" aria-hidden="true">topic</span>
        <span>Tema</span>
      </label>
      <input id="tema-input" type="text"
             placeholder="Ej: Derivadas, La Revolución Francesa, Fotosíntesis..."
             class="w-full px-space-sm py-2 rounded-lg bg-surface-container-high border border-outline-variant text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary-container"
             autocomplete="off">
    </div>

    <!-- Generate Button + Cost -->
    <div class="mt-space-lg flex items-center justify-between">
      <button id="generate-btn" type="button"
              title="Genera el material con el modelo configurado. Se deshabilita mientras la IA responde (el botón muestra «Generando…»)."
              class="flex items-center justify-center gap-1.5 px-space-md py-2.5 rounded-lg bg-primary-container text-on-primary-container font-label-md font-semibold hover:bg-primary-fixed-dim transition-all shadow-md">
        <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
        <span>Generar</span>
      </button>
      <div id="cost-info" aria-live="polite" class="flex items-center gap-1 font-code-inline text-[10px] text-outline">
        <span class="material-symbols-outlined text-[14px]">schedule</span>
        <span>Cargando...</span>
      </div>
    </div>
  </div>

  <!-- Results Area -->
  <div id="results-area" role="region" aria-live="polite" aria-label="Resultado de la generación"
       class="bg-surface-container border border-outline-variant/40 rounded-xl p-space-md min-h-[200px] flex items-center justify-center">
    <!--SLOT:INITIAL_HINT-->
  </div>
</div>

<script>
(function() {
  'use strict';

  var materiaSelect = document.getElementById('materia-select');
  var tipoSelect = document.getElementById('tipo-select');
  var temaInput = document.getElementById('tema-input');
  var generateBtn = document.getElementById('generate-btn');
  var resultsArea = document.getElementById('results-area');
  var costInfo = document.getElementById('cost-info');

  // ── helpers ────────────────────────────────────────────────────────────

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showLoading() {
    generateBtn.disabled = true;
    generateBtn.innerHTML =
      '<span class="material-symbols-outlined text-[18px] animate-spin">autorenew</span>' +
      '<span>Generando…</span>';
    resultsArea.innerHTML =
      '<div class="flex items-center justify-center gap-2 py-8">' +
      '  <span class="material-symbols-outlined text-primary animate-spin text-[24px]">autorenew</span>' +
      '  <span class="font-body-sm text-body-sm text-on-surface-variant">Generando material…</span>' +
      '</div>';
  }

  function hideLoading() {
    generateBtn.disabled = false;
    generateBtn.innerHTML =
      '<span class="material-symbols-outlined text-[18px]">auto_awesome</span>' +
      '<span>Generar</span>';
  }

  function renderError(message) {
    resultsArea.innerHTML =
      '<div class="flex items-start gap-2.5 p-space-sm bg-error-container/10 border border-error rounded-xl">' +
      '  <span class="material-symbols-outlined text-[20px] text-error shrink-0">error</span>' +
      '  <div class="flex-1 min-w-0">' +
      '    <p class="font-label-md text-label-md text-error font-semibold mb-1">Error</p>' +
      '    <p class="font-body-sm text-body-sm text-on-error-container">' + escapeHtml(message) + '</p>' +
      '  </div>' +
      '</div>';
  }

  function renderQuiz(quiz) {
    var html = '<div class="space-y-space-md">';
    html +=
      '<h3 class="font-headline-sm text-headline-sm text-primary-container flex items-center gap-1.5">' +
      '<span class="material-symbols-outlined text-[20px]">quiz</span>' +
      '<span>' + escapeHtml(quiz.title || 'Cuestionario') + '</span></h3>';

    if (quiz.questions && Array.isArray(quiz.questions)) {
      quiz.questions.forEach(function(q, i) {
        html += '<div class="bg-surface-container-high/40 rounded-lg p-space-sm">';
        html +=
          '<p class="font-label-md text-label-md text-on-surface font-semibold mb-2">' +
          (i + 1) + '. ' + escapeHtml(q.question || '') + '</p>';
        if (q.options && Array.isArray(q.options)) {
          var correctIdx = q.correct_answer;
          q.options.forEach(function(opt, j) {
            var isCorrect = j === correctIdx;
            var label = String.fromCharCode(65 + j);
            html +=
              '<div class="flex items-center gap-2 py-1">' +
              '<span class="font-code-inline text-[11px] text-outline w-4">' + label + '</span>' +
              '<span class="font-body-sm text-body-sm ' +
              (isCorrect ? 'text-secondary' : 'text-on-surface-variant') + '">' +
              escapeHtml(opt || '') + '</span>' +
              (isCorrect
                ? '<span class="material-symbols-outlined text-[14px] text-secondary">check_circle</span>'
                : '') +
              '</div>';
          });
        }
        html += '</div>';
      });
    } else {
      html +=
        '<p class="font-body-sm text-body-sm text-on-surface-variant">' +
        'No se pudieron parsear las preguntas del cuestionario.' +
        '</p>';
    }

    html += '</div>';
    resultsArea.innerHTML = html;
  }

  function renderText(text) {
    resultsArea.innerHTML =
      '<div class="overflow-x-auto">' +
      '<pre class="font-code-inline text-[11px] text-on-surface whitespace-pre-wrap leading-relaxed p-space-sm bg-surface-container-high rounded-lg max-w-full">' +
      escapeHtml(text) +
      '</pre>' +
      '</div>';
  }

  function renderGeneric(material) {
    // Fallback: render the raw material object as JSON in a <pre>.
    var json = JSON.stringify(material, null, 2);
    renderText(json);
  }

  // ── actions ────────────────────────────────────────────────────────────

  async function generate() {
    var materia = materiaSelect.value.trim();
    var tema = temaInput.value.trim();
    var tipo = tipoSelect.value;

    if (!materia || !tema || !tipo) {
      renderError('Selecciona una materia, escribe un tema y elige el tipo de material.');
      return;
    }

    showLoading();

    try {
      var resp = await fetch('/dashboard/material', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ materia: materia, tema: tema, tipo: tipo })
      });
      var data = await resp.json();

      hideLoading();

      if (data.ok) {
        if (data.material && data.material.questions) {
          renderQuiz(data.material);
        } else if (data.material && typeof data.material === 'string') {
          renderText(data.material);
        } else if (data.material) {
          renderGeneric(data.material);
        } else {
          renderText('Material generado sin contenido reconocible.');
        }
      } else {
        renderError(data.error || 'Error desconocido al generar material.');
      }
    } catch (err) {
      hideLoading();
      renderError('Error de conexión: ' + (err.message || 'No se pudo conectar al servidor.'));
    }
  }

  async function loadCost() {
    try {
      var resp = await fetch('/api/ai/cost');
      var data = await resp.json();
      costInfo.innerHTML =
        '<span class="text-primary-fixed-dim">$' +
        data.total_cost.toFixed(2) + ' / $' + data.budget_limit.toFixed(2) +
        '</span>';
    } catch (e) {
      costInfo.innerHTML = '<span class="text-outline">No disponible</span>';
    }
  }

  // ── event binding ──────────────────────────────────────────────────────

  generateBtn.addEventListener('click', generate);

  temaInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      generate();
    }
  });

  loadCost();
})();
</script>
